# Example host overlay for a Traefik setup. It does NOT live in the app's deploy path:
# copy it to /opt/apps/<repo>/compose.host.yml on the host and adapt it there.
# Router names must be unique per host, the entrypoint and cert resolver names must
# match your Traefik config, and the proxy network must already exist.
services:
  web:
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.fluxion.rule=Host(`fluxion.example.com`)
      - traefik.http.routers.fluxion.entrypoints=websecure
      - traefik.http.routers.fluxion.tls.certresolver=letsencrypt
      - traefik.http.services.fluxion.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
